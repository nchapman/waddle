cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "waddle"
    image: "ghcr.io/nchapman/waddle@sha256:7bfcc2b08ccc04b1841966ace7a3ac2b0e8ca2e55011c686a42ea3d07494ed11"
    networks: [outbound]
    env:
      - PORT: "8080"
      - NODE_ENV: "production"
      - CONCIERGE_URL: "https://waddle-concierge.ddg-waddle.containers.tinfoil.dev"
      - WADDLE_INSTANCE: "waddle"
      - WADDLE_WAKE_AUTONOMY: "1"
      - WADDLE_IDLE_MS: "600000"
    secrets:
      - CONCIERGE_SHARED_SECRET
      - TINFOIL_API_KEY

networks:
  outbound:
    egress: open   # the agent needs the real web — honest limit, per plan

shim:
  upstream-port: 8080
  paths:
    - /*
