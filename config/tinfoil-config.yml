cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "waddle"
    image: "ghcr.io/nchapman/waddle@sha256:333740164c93502e52e9d95057ebd9ad3eace506426e33444395a8990c3750af"
    networks: [outbound]
    env:
      - PORT: "8080"
      - NODE_ENV: "production"

networks:
  outbound:
    egress: open   # the agent needs the real web — honest limit, per plan

shim:
  upstream-port: 8080
  paths:
    - /*
