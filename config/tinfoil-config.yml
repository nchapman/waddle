cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "waddle"
    image: "ghcr.io/nchapman/waddle@sha256:ae3e386c5aaf43eff599d22833853e34d7eb40d8372eee183fe1d2412ae4a25a"
    networks: [outbound]
    env:
      - PORT: "8080"
      - NODE_ENV: "production"

networks:
  outbound:
    egress: open   # the agent needs the real web — honest limit, per plan

shim:
  upstream-port: 8080
  paths:
    - /*
