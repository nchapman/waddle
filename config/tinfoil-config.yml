cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "waddle"
    image: "ghcr.io/nchapman/waddle@sha256:7e230fe71fa3fa2ccdab6daecfd6cbcb29deff62fe06407f8b0dfe723b6c03e4"
    networks: [outbound]
    env:
      - PORT: "8080"
      - NODE_ENV: "production"
      - CONCIERGE_URL: "https://waddle-concierge.ddg-waddle.containers.tinfoil.dev"
      - WADDLE_INSTANCE: "waddle"
      - WADDLE_WAKE_AUTONOMY: "1"
    secrets:
      - CONCIERGE_SHARED_SECRET

networks:
  outbound:
    egress: open   # the agent needs the real web — honest limit, per plan

shim:
  upstream-port: 8080
  paths:
    - /*
