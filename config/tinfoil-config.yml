cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "waddle"
    image: "ghcr.io/nchapman/waddle@sha256:c5a3864e8c7eb5f80f94400926ac4e8bcc563ff79243d12984f0594ffabeadcd"
    networks: [outbound]
    env:
      - PORT: "8080"
      - NODE_ENV: "production"

networks:
  outbound:
    egress: open   # the agent needs the real web — honest limit, per plan

shim:
  upstream-port: 8080
  paths:
    - /*
