cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "waddle"
    image: "ghcr.io/nchapman/waddle@sha256:46ebdc1a299e4b341667cc8edb07b48b72b3dcb8bb958fef2e49141f1cddd4b8"
    networks: [outbound]
    env:
      - PORT: "8080"
      - NODE_ENV: "production"
      - CONCIERGE_URL: "https://waddle-concierge.ddg-waddle.containers.tinfoil.dev"
      - WADDLE_INSTANCE: "waddle"
      - WADDLE_WAKE_AUTONOMY: "1"
      - WADDLE_IDLE_MS: "600000"
    secrets:
      - CONCIERGE_SHARED_SECRET
      - TINFOIL_API_KEY

networks:
  outbound:
    egress: open   # the agent needs the real web — honest limit, per plan

shim:
  upstream-port: 8080
  paths:
    - /*
