cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "waddle"
    image: "ghcr.io/nchapman/waddle@sha256:c8ca0054d619017d7a74d6cb35a739b2223a05077934c43e93eea2247a36d267"
    networks: [outbound]
    env:
      - PORT: "8080"
      - NODE_ENV: "production"

networks:
  outbound:
    egress: open   # the agent needs the real web — honest limit, per plan

shim:
  upstream-port: 8080
  paths:
    - /*
