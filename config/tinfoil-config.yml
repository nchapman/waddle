cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "waddle"
    image: "ghcr.io/nchapman/waddle@sha256:c725e5fba7ae3ee4e72db5edb6d9565feecfd5f702b177f1e38cba47c25bea4e"
    networks: [outbound]
    env:
      - PORT: "8080"
      - NODE_ENV: "production"

networks:
  outbound:
    egress: open   # the agent needs the real web — honest limit, per plan

shim:
  upstream-port: 8080
  paths:
    - /*
