cvm-version: 0.14.7
cpus: 2
memory: 2048

containers:
  - name: "waddle-concierge"
    image: "ghcr.io/nchapman/waddle-concierge@sha256:6f9b592548be500cc082e3479f9765d0a6166ead207e13354992492fe5720f5f"
    networks: [control]
    env:
      - CONCIERGE_PORT: "8081"
      - CONCIERGE_BACKEND: "tinfoil"
      - CONCIERGE_ALLOWED_ORIGINS: "http://localhost:5173"
      - NODE_ENV: "production"
      # Warm-standby pool: one blank machine ready to hand out
      - WARM_POOL_SIZE: "1"
      - STANDBY_TTL_MS: "3600000"
      - STANDBY_CONFIG_REPO: "nchapman/waddle-config"
      - STANDBY_CONFIG_TAG: v0.0.52
      # fire→pull release window: 10 min — certificate issuance once
      # measured 5.4 min, closing the old hard 3-min window (v0.3.13)
      - WAKE_RELEASE_WINDOW_MS: "600000"
      - INSTANCE_DOMAIN_BASE: "ddg-waddle.containers.tinfoil.dev"
      # Client auth: betterbase JWTs (signature+issuer+audience) on the
      # external tier — the per-user identity the cattle naming builds on
      - CONCIERGE_JWKS_URL: "https://accounts.betterbase.dev/.well-known/jwks.json"
      - CONCIERGE_ISSUER: "https://betterbase.dev"   # the apex is what prod accounts stamps in iss
      - CONCIERGE_AUDIENCE: "d096d76d-d066-4ac9-956c-ad3f35c57450"
    secrets:
      - TINFOIL_ADMIN_KEY
      - CONCIERGE_TOKEN

networks:
  control:
    egress: allowlist
    allow:
      - api.tinfoil.sh   # the only verb surface: container deploy/stop/list
      - accounts.betterbase.dev   # JWKS fetch (client JWT verification)
      # NOTE: instance /health probes CANNOT be allowlisted here — the platform
      # resolves entries at deploy time, and instance hosts NXDOMAIN while
      # stopped (stop = DNS teardown). Probes degrade to always-dance on fires
      # (correct, one wasted boot); PLAN.md tracks the wildcard/CIDR ask.


shim:
  upstream-port: 8081
  paths:
    - /health
    - /status
    - /handshake
    - /timer
    - /wake
    - /assign
    - /boot
    - /boot/ready
    - /handoff
    - /handoff/pull
    - /handoff/post
    - /handoff/post/pull
  origins:
    - http://localhost:5173
