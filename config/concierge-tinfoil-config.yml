cvm-version: 0.14.7
cpus: 2
memory: 2048

containers:
  - name: "waddle-concierge"
    image: "ghcr.io/nchapman/waddle-concierge@sha256:f4aa011f8d9131002c897c8c5e2681538f18a97f3268779a87626b55e5567732"
    networks: [control]
    env:
      - CONCIERGE_PORT: "8081"
      - CONCIERGE_BACKEND: "tinfoil"
      - CONCIERGE_ALLOWED_ORIGINS: "http://localhost:5173"
      - NODE_ENV: "production"
      # Warm-standby pool: one blank machine ready to hand out
      - WARM_POOL_SIZE: "1"
      - STANDBY_TTL_MS: "3600000"
      - STANDBY_CONFIG_REPO: "nchapman/waddle-config"
      - STANDBY_CONFIG_TAG: "v0.0.47"
      # fire→pull release window: 10 min — certificate issuance once
      # measured 5.4 min, closing the old hard 3-min window (v0.3.13)
      - WAKE_RELEASE_WINDOW_MS: "600000"
      - INSTANCE_DOMAIN_BASE: "ddg-waddle.containers.tinfoil.dev"
      - CONCIERGE_ALLOWED_INSTANCES: "waddle"
    secrets:
      - TINFOIL_ADMIN_KEY
      - CONCIERGE_TOKEN

networks:
  control:
    egress: allowlist
    allow:
      - api.tinfoil.sh   # the only verb surface: container deploy/stop/list


shim:
  upstream-port: 8081
  paths:
    - /health
    - /status
    - /handshake
    - /timer
    - /wake
    - /assign
    - /handoff
    - /handoff/pull
    - /handoff/post
    - /handoff/post/pull
  origins:
    - http://localhost:5173
