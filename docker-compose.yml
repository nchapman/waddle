# The hot loop: VM source mounted, tsx watch, restart "no" so agent
# self-sleep (process exit) behaves exactly as in production.
# Tinfoil is truth — this exists only for iteration speed (see PLAN.md).
services:
  vm:
    build: { context: ., target: build }
    command: sh -c "pnpm --filter @waddle/app dev"
    working_dir: /app
    ports: ["8080:8080"]
    environment:
      NODE_ENV: development
    volumes:
      - ./app/src:/app/vm/src
      - ./sdk/src:/app/sdk/src
      - ./data/volume:/data/volume # the "encrypted volume" stand-in
    restart: "no"
