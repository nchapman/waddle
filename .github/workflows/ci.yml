name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Root playwright dep is for scripts/live-smoke.mjs (system Chrome) —
      # CI never downloads browsers.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      # The client's betterbase dep is a link: to a sibling path
      # (../../betterbase-dev/betterbase/js — the local dev workspace nests
      # it that way). The public BetterbaseHQ/betterbase repo has the same
      # package at js/ (package.json byte-identical). Checkout can't write
      # outside the workspace, so fetch inside and move it to the exact
      # path the link resolves to. Tracks the upstream default branch.
      - uses: actions/checkout@v4
        with:
          repository: BetterbaseHQ/betterbase
          path: .bb-checkout
      - run: |
          mkdir -p "${GITHUB_WORKSPACE}/../betterbase-dev"
          mv "$GITHUB_WORKSPACE/.bb-checkout" "${GITHUB_WORKSPACE}/../betterbase-dev/betterbase"
      # The js package's sources import wasm pkg/ artifacts from sibling
      # crates/ — built, not committed. Build them the canonical way.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "../betterbase-dev/betterbase"
      - run: bash scripts/build-wasm.sh
        working-directory: ../betterbase-dev/betterbase/js
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # betterbase/js is linked as TypeScript source; its own deps must be
      # present for the client's typecheck to resolve its imports.
      - run: pnpm -C ../betterbase-dev/betterbase/js install --frozen-lockfile
      - run: pnpm check # typecheck (+ sdk build) across all packages
      - run: pnpm test # 255 unit tests: sdk, server (incl. real-socket ws), concierge, client
      - run: pnpm build # client vite build catches bundling/import breakage
