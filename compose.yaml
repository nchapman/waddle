# Compose parity: the same image Tinfoil measures, run hot.
#   just up          — pinned prod digest (the live enclave, byte-for-byte)
#   just up-dev      — local build (compose.dev.yaml) + concierge wiring,
#                      for the wake/stop E2E loop
# The concierge stays operator-side (host node process, docker backend —
# the seam the design promises, not a code fork), exactly like its
# tinfoil-backend sibling. betterbase-dev runs next door
# (`cd ../betterbase-dev && just dev`) when the shelf is in play.
services:
  waddle:
    image: ghcr.io/nchapman/waddle@sha256:f25e9bbf4aca63ba3adf32ccccd68501857f09eb3bb92a523fb9deba32a91c4c
    platform: linux/amd64
    container_name: waddle # stable name for the concierge's docker start/stop
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATA_DIR: /data # compose volume: the log survives restarts locally
      WADDLE_IDLE_MS: "3600000" # 1h — local sleep is manual in practice
      WADDLE_MODEL: ${WADDLE_MODEL:-deepseek-v4-1-flash}
      WADDLE_BROWSER_ALLOWLIST: example.com,news.ycombinator.com,en.wikipedia.org,tinfoil.sh,localhost,host.docker.internal
    volumes:
      - waddle-data:/data
    restart: "no" # sleep = exit stays true locally

volumes:
  waddle-data:
