<!doctype html>
<html>
<body>
<pre id="out">put-probe…</pre>
<script type="module">
  const out = (s) => { document.getElementById("out").textContent += "\n" + s; };
  try {
    const bbdb = await import("betterbase/db");
    const { snapshots, SNAPSHOT_ID } = await import("./src/lib/bb-collections.ts");
    const worker = { worker: new Worker(new URL("./src/workers/bb-db-worker.ts", import.meta.url), { type: "module" }) };
    out("opening db…");
    const db = await bbdb.createDatabase("waddle-probe2", [snapshots], worker);
    out("db open — putting tiny blob…");
    const t0 = performance.now();
    await db.put(snapshots, { id: SNAPSHOT_ID, blob: "hello", gen: 1, savedAt: Date.now() });
    out(`TINY PUT OK in ${Math.round(performance.now() - t0)}ms`);
    out("putting 100KB blob…");
    const t1 = performance.now();
    await db.put(snapshots, { id: SNAPSHOT_ID, blob: "x".repeat(100_000), gen: 2, savedAt: Date.now() });
    out(`100KB PUT OK in ${Math.round(performance.now() - t1)}ms`);
    out("updating it (CRDT re-merge)…");
    const t2 = performance.now();
    await db.put(snapshots, { id: SNAPSHOT_ID, blob: "y".repeat(100_000), gen: 3, savedAt: Date.now() });
    out(`UPDATE PUT OK in ${Math.round(performance.now() - t2)}ms`);
    out("ALL GOOD — no wedge");
  } catch (e) {
    out("ERROR: " + (e?.stack ?? e));
  }
</script>
</body>
</html>
